name: Daily backlink audit
on:
  workflow_dispatch:
    inputs:
      submit_free:
        description: 'Submit once to QuestStack free queue (no paid extras)'
        type: boolean
        default: false
  schedule:
    - cron: '30 0 * * *'
permissions:
  contents: read
concurrency:
  group: backlink-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: |
            state.json
            submission-tracker.json
          key: backlink-state-v33-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            backlink-state-v33-
            backlink-state-v32-
            backlink-state-v31-
            backlink-state-v3-
            backlink-state-v2-
      - run: python3 -m py_compile bot_v2.py bot_v33.py
      - run: python3 bot_v33.py
      - run: python3 submit_v4.py
        env:
          ALLOW_SUBMIT: ${{ inputs.submit_free }}
          CONTACT_EMAIL: ${{ secrets.SUBMISSION_EMAIL }}
      - uses: actions/upload-artifact@v5
        with:
          name: backlink-report
          path: |
            report.csv
            opportunities.csv
            verified-links.csv
            discovery-status.txt
            outreach-drafts.md
            submission-result.json
            submission-tracker.json
            state.json
          retention-days: 30
