name: Daily backlink audit
on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 bot.py
      - uses: actions/upload-artifact@v4
        with:
          name: backlink-report
          path: report.csv
          retention-days: 30
