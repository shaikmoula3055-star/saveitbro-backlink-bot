name: Daily backlink audit V5
on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'
permissions:
  contents: write
concurrency:
  group: backlink-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: actions/cache@v4
        with:
          path: |
            state.json
            submission-tracker.json
          key: backlink-state-v5-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            backlink-state-v5-
            backlink-state-v33-
            backlink-state-v32-
      - run: python3 -m py_compile bot_v2.py bot_v33.py bot_v5.py
      - run: python3 bot_v5.py
        env:
          BLOGGER_TOKEN: ${{ secrets.BLOGGER_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          WORDPRESS_TOKEN: ${{ secrets.WORDPRESS_TOKEN }}
          WORDPRESS_SITE_ID: ${{ secrets.WORDPRESS_SITE_ID }}
      - name: Persist ledger
        if: always()
        run: |
          if test -f v5-ledger.json; then
            git add v5-ledger.json
            git diff --cached --quiet || (git commit -m "Update V5 backlink ledger" && git push)
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: backlink-report
          path: |
            report.csv
            opportunities.csv
            verified-links.csv
            discovery-status.txt
            outreach-drafts.md
            v5-report.json
            v5-ledger.json
          retention-days: 30
